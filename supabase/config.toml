project_id = "tripways-backend"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = [
  "./seed/fixture.sql",
  "./seed/flight_routing_fixture.sql",
  "./seed/city_pseo_fixture.sql",
  "./seed/airport_pseo_fixture.sql",
  "./seed/provider_ready_page_fixture.sql",
  "./seed/ourairports_source.sql",
]

[realtime]
enabled = false

[studio]
enabled = true
port = 55323
api_url = "http://127.0.0.1"

[inbucket]
enabled = false

[storage]
enabled = true

[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits"

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083

[functions.system-health]
enabled = true
verify_jwt = false
import_map = "./functions/deno.json"
entrypoint = "./functions/v1/system/health/index.ts"

[functions.user-profile]
enabled = true
verify_jwt = true
import_map = "./functions/deno.json"
entrypoint = "./functions/v1/user/profile/index.ts"

[functions.user-account-security]
enabled = true
verify_jwt = true
import_map = "./functions/deno.json"
entrypoint = "./functions/v1/user/account-security/index.ts"

[functions.user-delete-account]
enabled = true
verify_jwt = true
import_map = "./functions/deno.json"
entrypoint = "./functions/v1/user/delete-account/index.ts"

[functions.route-search-query]
enabled = true
verify_jwt = false
import_map = "./functions/deno.json"
entrypoint = "./functions/v1/route-search/query/index.ts"

[functions.page-query]
enabled = true
verify_jwt = false
import_map = "./functions/deno.json"
entrypoint = "./functions/v1/page/query/index.ts"

[functions.ingestion-base-data]
enabled = true
verify_jwt = false
import_map = "./functions/deno.json"
entrypoint = "./functions/v1/ingestion/base-data/index.ts"

[functions.ingestion-price-estimates]
enabled = true
verify_jwt = false
import_map = "./functions/deno.json"
entrypoint = "./functions/v1/ingestion/price-estimates/index.ts"

[functions.sitemap-query]
enabled = true
verify_jwt = false
import_map = "./functions/deno.json"
entrypoint = "./functions/v1/sitemap/query/index.ts"
